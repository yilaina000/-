{% extends "base.html" %}
{% block content %}
<div style="display:flex;justify-content:space-between;align-items:center;margin:20px 0">
    <h2>浏览历史</h2>
    <a href="/my/clear_history" class="btn red" onclick="return confirm('确定清空？')">清空历史记录</a>
</div>

<div class="grid">
    {% for item in list_data %}
    <div class="card">
        <a href="/anime/{{item.id}}">
            <img data-src="{{item.cover}}" class="lazy" alt="{{item.title}}">
            <h3>{{item.title}}</h3>
            <small>{{item.created_at}}</small>
        </a>
    </div>
    {% endfor %}
</div>
{% endblock %}
